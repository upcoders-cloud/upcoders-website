<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
    Tytuł, opis, canonical, hreflang, Open Graph i Twitter Cards ustawia
    komponent src/seo/Seo.jsx per trasa i per język (React 19 wynosi je do head).
    Nic z tego nie może stać tutaj na sztywno, bo powstałyby duplikaty,
    a każda podstrona dziedziczyłaby dane strony głównej.
    Poniższy tytuł jest tylko wartością awaryjną dla powłoki SPA.
  -->
    <title id="uc-fallback-title">Upcoders</title>
    <meta name="author" content="Upcoders" />

    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="/uc-logo-small.svg" />

    <!-- PRELOAD FONTS: only the faces the home hero uses (H1 800 -> Bold, text 400, nav/CTA 500).
         Absolute /src paths let Vite hash them to the same files the @font-face rules load. -->
    <link
      rel="preload"
      href="/src/assets/fonts/DM_Sans/DMSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/DM_Sans/DMSans-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/DM_Sans/DMSans-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- STRUCTURED DATA -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Upcoders",
        "url": "https://upcoders.cloud",
        "logo": "https://upcoders.cloud/uc-logo.png",
        "email": "contact@upcoders.cloud",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Wawrzyńca Engestroma 10",
          "postalCode": "60-571",
          "addressLocality": "Poznań",
          "addressCountry": "PL"
        },
        "description": "We design and develop tailored applications for industrial and technical companies.",
        "sameAs": ["https://www.linkedin.com/company/upcoders-cloud"]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
